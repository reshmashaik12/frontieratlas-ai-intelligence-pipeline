[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-atlas-ingestion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10",
    "aiosqlite>=0.20",
    "feedparser>=6.0",
    "python-dateutil>=2.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "PyYAML>=6.0",
    "pip-system-certs>=5.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24"
]
browser = [
    "playwright>=1.50"
]
docs = [
    "reportlab>=4.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]